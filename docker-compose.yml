services:
  # ==================== Milvus 服务 ====================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - milvus

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - milvus

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:2.6-20260417-84a142e3-gpu-amd64
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./milvus_data:/milvus_data
      - ./milvus_etcd:/etcd
      - ./milvus_minio:/minio_data
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - milvus

  # ==================== FastAPI Chat API 服务 ====================
  langgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - milvus
    environment:
      # Milvus 配置
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: knowledge_base
      # Anthropic/MiniMax 配置
      ANTHROPIC_BASE_URL: https://api.minimaxi.com/anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: MiniMax-M2.7
      # LangSmith
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-knowledge-rag}
      # Session Persistence
      SESSION_PERSISTENCE: ${SESSION_PERSISTENCE:-true}
      SESSION_STORAGE_DIR: /app/sessions
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
    volumes:
      - session-data:/app/sessions
    networks:
      - milvus

volumes:
  milvus_data:
  milvus_etcd:
  milvus_minio:
  session-data:

networks:
  milvus:
    driver: bridge
